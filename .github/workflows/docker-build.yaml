name: Manual Docker Build

# 纯手动触发:不监听 push/tag,只在 Actions 页面手动点 Run。
# 每个 build job 把镜像导出为 .tar 作中间 artifact;package job 等全部构建
# 完成后下载所有 tar,用 gzip -9(最大压缩级别)压成单个
# weknora-docker-images.tar.gz 上传。跑完在运行页 Artifacts 区下载这一个包即可。
# 本地:tar xzf weknora-docker-images.tar.gz && docker load -i weknora-*.tar
# 分支由 GitHub 手动触发 UI 自带的 ref 选择器决定。

on:
  workflow_dispatch:
    inputs:
      build_all:
        description: "构建所有包(勾选后忽略下方单独选项)"
        type: boolean
        default: false
      build_ui:
        description: "构建 ui"
        type: boolean
        default: false
      build_app:
        description: "构建 app"
        type: boolean
        default: false
      build_docreader:
        description: "构建 docreader"
        type: boolean
        default: false
      build_sandbox:
        description: "构建 sandbox"
        type: boolean
        default: false
      build_sandbox_cube:
        description: "构建 sandbox-cube(含 envd,Cube 集群用)"
        type: boolean
        default: false
      image_tag:
        description: "镜像 tag(留空默认 latest;对应 docker-compose 的 WEKNORA_VERSION)"
        type: string
        default: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-ui:
    if: ${{ inputs.build_all == true || inputs.build_ui == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare version info
        id: version
        run: |
          eval "$(./scripts/get_version.sh env)"
          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        env:
          VITE_IS_DOCKER: true
          VITE_FRONTEND_COMMIT: ${{ steps.version.outputs.commit_id }}
        run: ./scripts/build_frontend_dist.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ui Image
        uses: docker/build-push-action@v7
        with:
          push: false
          platforms: linux/amd64
          file: frontend/Dockerfile
          context: ./frontend
          tags: wechatopenai/weknora-ui:${{ inputs.image_tag }}
          outputs: type=docker,dest=/tmp/weknora-ui.tar
          cache-from: type=gha,scope=build-ui
          cache-to: type=gha,scope=build-ui,mode=max

      - name: Upload ui image (intermediate)
        uses: actions/upload-artifact@v7
        with:
          name: weknora-ui
          path: /tmp/weknora-ui.tar
          if-no-files-found: error
          retention-days: 1

  build-docreader:
    if: ${{ inputs.build_all == true || inputs.build_docreader == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build docreader Image
        uses: docker/build-push-action@v7
        with:
          push: false
          platforms: linux/amd64
          file: docker/Dockerfile.docreader
          context: .
          tags: wechatopenai/weknora-docreader:${{ inputs.image_tag }}
          outputs: type=docker,dest=/tmp/weknora-docreader.tar
          cache-from: type=gha,scope=build-docreader
          cache-to: type=gha,scope=build-docreader,mode=max

      - name: Upload docreader image (intermediate)
        uses: actions/upload-artifact@v7
        with:
          name: weknora-docreader
          path: /tmp/weknora-docreader.tar
          if-no-files-found: error
          retention-days: 1

  build-sandbox:
    if: ${{ inputs.build_all == true || inputs.build_sandbox == true || inputs.build_sandbox_cube == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build sandbox Image
        if: ${{ inputs.build_all == true || inputs.build_sandbox == true }}
        uses: docker/build-push-action@v7
        with:
          push: false
          platforms: linux/amd64
          file: docker/Dockerfile.sandbox
          target: sandbox
          context: .
          tags: wechatopenai/weknora-sandbox:${{ inputs.image_tag }}
          outputs: type=docker,dest=/tmp/weknora-sandbox.tar
          cache-from: type=gha,scope=build-sandbox
          cache-to: type=gha,scope=build-sandbox,mode=max

      - name: Upload sandbox image (intermediate)
        if: ${{ inputs.build_all == true || inputs.build_sandbox == true }}
        uses: actions/upload-artifact@v7
        with:
          name: weknora-sandbox
          path: /tmp/weknora-sandbox.tar
          if-no-files-found: error
          retention-days: 1

      # Cube builds templates straight from the image and gates the build on
      # GET :49983/health, so it needs the variant with envd baked in.
      - name: Build sandbox Cube Image
        if: ${{ inputs.build_all == true || inputs.build_sandbox_cube == true }}
        uses: docker/build-push-action@v7
        with:
          push: false
          platforms: linux/amd64
          file: docker/Dockerfile.sandbox
          target: cube
          context: .
          tags: wechatopenai/weknora-sandbox-cube:${{ inputs.image_tag }}
          outputs: type=docker,dest=/tmp/weknora-sandbox-cube.tar
          cache-from: type=gha,scope=build-sandbox-cube
          cache-to: type=gha,scope=build-sandbox-cube,mode=max

      - name: Upload sandbox cube image (intermediate)
        if: ${{ inputs.build_all == true || inputs.build_sandbox_cube == true }}
        uses: actions/upload-artifact@v7
        with:
          name: weknora-sandbox-cube
          path: /tmp/weknora-sandbox-cube.tar
          if-no-files-found: error
          retention-days: 1

  build-app:
    if: ${{ inputs.build_all == true || inputs.build_app == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare version info
        id: version
        run: |
          eval "$(./scripts/get_version.sh env)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "go_version=$GO_VERSION" >> $GITHUB_OUTPUT
          ./scripts/get_version.sh info

      - name: Build app Image
        uses: docker/build-push-action@v7
        with:
          push: false
          platforms: linux/amd64
          file: docker/Dockerfile.app
          context: .
          build-args: |
            ${{ format('VERSION_ARG={0}', steps.version.outputs.version) }}
            ${{ format('COMMIT_ID_ARG={0}', steps.version.outputs.commit_id) }}
            ${{ format('BUILD_TIME_ARG={0}', steps.version.outputs.build_time) }}
            ${{ format('GO_VERSION_ARG={0}', steps.version.outputs.go_version) }}
          tags: wechatopenai/weknora-app:${{ inputs.image_tag }}
          outputs: type=docker,dest=/tmp/weknora-app.tar
          cache-from: type=gha,scope=build-app
          cache-to: type=gha,scope=build-app,mode=max

      - name: Upload app image (intermediate)
        uses: actions/upload-artifact@v7
        with:
          name: weknora-app
          path: /tmp/weknora-app.tar
          if-no-files-found: error
          retention-days: 1

  # 等所有勾选的 build job 完成后,下载全部中间 tar,gzip -9 压成单个包上传。
  # 任一构建成功即运行;被取消才跳过。被跳过的 build job 不产 artifact,
  # download 自然只取已成功那部分。
  package:
    needs: [build-ui, build-docreader, build-sandbox, build-app]
    if: ${{ !cancelled() && (needs.build-ui.result == 'success' || needs.build-docreader.result == 'success' || needs.build-sandbox.result == 'success' || needs.build-app.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all image artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/images
          merge-multiple: true

      - name: Show downloaded images
        run: |
          echo "下载到的镜像 tar:"
          ls -lh /tmp/images/

      - name: Compress into single tar.gz (gzip -9, max level)
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage /tmp/out
          # 严格白名单:只收 weknora-* 镜像 tar,丢弃任何其他文件。
          # -type f 排除软链接;-maxdepth 1 不递归子目录(download-artifact
          # merge-multiple 本应拍平,这里再加一层防御)。
          find /tmp/images -maxdepth 1 -type f -name 'weknora-*.tar' \
            -exec cp -t /tmp/stage {} +
          if [ -z "$(ls -A /tmp/stage 2>/dev/null)" ]; then
            echo "没有找到任何 weknora-*.tar 镜像文件" >&2
            exit 1
          fi
          # 防御:staging 区若出现任何软链接则拒绝打包,避免把指向 root 等
          # 敏感路径的软链接写进归档(解包时会跟随/覆盖目标)。
          if find /tmp/stage -maxdepth 1 -type l | grep -q .; then
            echo "staging 区存在软链接,拒绝打包:" >&2
            find /tmp/stage -maxdepth 1 -type l -ls >&2
            exit 1
          fi
          echo "打包以下镜像:"
          ls -lh /tmp/stage/
          # 关键:只归档 .tar 文件本身,绝不归档 "." 目录条目。
          # 若用 "tar -C /tmp/stage ." 会把 staging 目录元数据(属主/权限/mtime,
          # 来自 CI runner)写进归档,解包时 tar 会把这些元数据套到当前目录上,
          # 上次 "root 目录权限变了" 就是这个 "." 条目导致的。这里用
          # --files-from 只列文件名,从源头不产生 "." 条目。
          find /tmp/stage -maxdepth 1 -type f -name 'weknora-*.tar' -printf '%f\0' \
            | tar --null --files-from=- \
                  --use-compress-program="gzip -9" \
                  -cf /tmp/out/weknora-docker-images.tar.gz -C /tmp/stage
          echo "压缩完成:"
          ls -lh /tmp/out/weknora-docker-images.tar.gz
          # 列出归档内容供核对:应只见 weknora-*.tar,不得出现 . 或目录条目。
          echo "归档内容核对:"
          tar tzf /tmp/out/weknora-docker-images.tar.gz
          # 硬校验:归档里每一条都必须匹配 weknora-*.tar,否则直接失败,
          # 绝不让任何其他内容(目录条目/软链接/无关文件)随归档上传。
          bad="$(tar tzf /tmp/out/weknora-docker-images.tar.gz | grep -v '^weknora-[^/]*\.tar$' || true)"
          if [ -n "$bad" ]; then
            echo "归档含非 weknora-*.tar 条目,拒绝上传:" >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi
          echo "归档校验通过:仅含 weknora-*.tar"

      - name: Upload unified archive
        uses: actions/upload-artifact@v7
        with:
          name: weknora-docker-images
          path: /tmp/out/weknora-docker-images.tar.gz
          if-no-files-found: error
          retention-days: 7